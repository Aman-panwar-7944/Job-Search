<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Hire - Jobs</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header><h1>Ai Based Resume Screening System</h1><div><span id="who"></span> <button class="light" onclick="logout()">Logout</button></div></header>
<main>
  <div class="card">
    <h3>My skills</h3>
    <p class="muted">Jobs are ranked by how well they match your skills.</p>
    <input id="skills" placeholder="java, sql, html, css">
    <button onclick="saveSkills()">Save skills</button>
  </div>

  <h2>Jobs for you</h2>
  <div id="jobs"></div>

  <h2>My applications</h2>
  <div class="card"><table><thead><tr><th>Job</th><th>Applied</th><th>Status</th></tr></thead><tbody id="apps"></tbody></table></div>
</main>
<script src="/js/common.js"></script>
<script>
const $ = id => document.getElementById(id);
let known = null;

function card(j) {
  return `<div class="card">
    <div class="row"><h3 style="margin:0">${esc(j.title)}</h3><span class="badge">${j.match}% skill match</span></div>
    <div class="bar"><div style="width:${j.match}%"></div></div>
    <p>${esc(j.description)}</p>
    <p class="muted">Required skills: ${esc(j.requiredSkills)} &middot; Min experience: ${j.minExperience} yr</p>
    ${j.applied ? '<span class="badge ok">Applied</span>'
      : `<input type="file" id="f${j.id}" accept=".pdf,.docx,.txt"><button onclick="apply(${j.id})">Apply with resume</button>`}
  </div>`;
}

async function loadJobs(initial) {
  const jobs = await api('/api/jobs');
  const ids = new Set(jobs.map(j => j.id));
  let fresh = [];
  if (known) fresh = jobs.filter(j => !known.has(j.id));
  if (initial || fresh.length) {
    $('jobs').innerHTML = jobs.length ? jobs.map(card).join('') : '<p class="muted">No jobs posted yet.</p>';
  }
  if (fresh.length) toast('New job posted: ' + fresh.map(j => j.title).join(', '));
  known = ids;
}

async function loadApps() {
  const apps = await api('/api/my-applications');
  $('apps').innerHTML = apps.length
    ? apps.map(a => `<tr><td>${esc(a.title)}</td><td>${esc(a.appliedAt)}</td><td><span class="badge ${a.status === 'SHORTLISTED' ? 'ok' : a.status === 'REJECTED' ? 'bad' : ''}">${esc(a.status)}</span></td></tr>`).join('')
    : '<tr><td colspan="3" class="muted">No applications yet.</td></tr>';
}

async function saveSkills() {
  try { await post('/api/profile', { skills: $('skills').value }); toast('Skills saved'); await loadJobs(true); }
  catch (e) { toast(e.message); }
}

async function apply(id) {
  const f = $('f' + id).files[0];
  if (!f) return toast('Choose your resume first');
  try {
    await api('/api/apply?jobId=' + id, { method: 'POST', headers: { 'X-Filename': encodeURIComponent(f.name) }, body: f });
    toast('Application submitted!');
    await loadJobs(true); await loadApps();
  } catch (e) { toast(e.message); }
}

(async () => {
  const me = await api('/api/me');
  if (me.role !== 'USER') return location.href = '/admin.html';
  $('who').textContent = me.name;
  $('skills').value = me.skills;
  await loadJobs(true); await loadApps();
  setInterval(() => loadJobs(false).catch(() => {}), 30000);   // new-job notifications
})();
</script>
</body>
</html>
